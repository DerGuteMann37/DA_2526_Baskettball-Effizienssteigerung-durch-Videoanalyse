<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Charts</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>body{background:#050a18;color:#fff;font-family:Lexend,system-ui;}</style>
</head>
<body>
  <h1>Flugbahn-Diagramme (Placeholder)</h1>
  <canvas id="trajectoryChart" width="600" height="400"></canvas>
  <script>
    const ctx = document.getElementById('trajectoryChart');
    new Chart(ctx, {
      type:'line',
      data:{labels:[0,1,2,3,4,5,6],datasets:[{label:'Soll',data:[0,2,4,5,4,2,0],borderColor:'#00cc88'},{label:'Ist',data:[0,1.8,3.5,4.9,4.2,1.7,0],borderColor:'#0077cc'}]},
      options:{plugins:{legend:{labels:{color:'#fff'}}},scales:{x:{title:{display:true,text:'Distanz'}},y:{title:{display:true,text:'Höhe'}}}
    });
  </script>
</body>
</html>
