name: Build and send diploma thesis

on: 
  push:
    branches:
      - wolf
    paths:
      - Diplomarbeit/**
  workflow_dispatch:

jobs:
  build-send:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install prerequisites (pandoc, rsync, TeX Live xetex + language packs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc rsync texlive-xetex texlive-fonts-recommended texlive-latex-extra lmodern texlive-lang-german

      - name: Build diploma thesis (local runner)
        working-directory: Diplomarbeit/da-base-template
        run: |
          # Use the repository's Diplomarbeit folder as the source dir
          make pdf SOURCEDIR=.. 

      - name: Upload produced PDF (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diplomarbeit-pdf
          path: Diplomarbeit/da-base-template/staging/diplomarbeit.pdf
