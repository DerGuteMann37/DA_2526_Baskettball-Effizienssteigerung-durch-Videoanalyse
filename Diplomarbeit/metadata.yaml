da-kurzfassung-de: Ziel dieser Diplomarbeit war die Entwicklung eines softwaregestützten Systems zur Analyse und Verbesserung von Basketballwürfen mithilfe von Videoanalyse. Im Mittelpunkt steht die objektive Auswertung der Wurftechnik, um Spieler*innen durch messbare Daten und visuelles Feedback bei der Optimierung ihrer Leistung zu unterstützen.
  Das entwickelte Gesamtsystem kombiniert mehrere technische Teilbereiche. 
  Zunächst werden aus Videodaten wesentliche Parameter des Wurfes, wie Abwurfpunkt, Abwurfwinkel und Flugbahn des Balls, ermittelt.
  Anschließend wird die tatsächliche Ist-Flugbahn mit einer berechneten idealen Soll-Flugbahn verglichen, sodass Abweichungen sichtbar und nachvollziehbar dargestellt werden können. 
  Da sich die automatische Ballerkennung unter realen Bedingungen als nicht ausreichend zuverlässig erwies, wurde zur Sicherstellung genauer Ergebnisse eine manuelle Initialisierung eingesetzt.
  Für die Verarbeitung und Speicherung der erfassten Daten wurde ein Backend auf Basis von Spring Boot entwickelt. 
  Dieses verwaltet Spieler-, Trainings- und Wurfdaten in einer Datenbank, berechnet statistische Kennzahlen und stellt die Ergebnisse über eine REST-Schnittstelle bereit. 
  Ergänzend dazu wurde ein browserbasiertes Frontend umgesetzt, das Funktionen wie Login, Dashboard, Video-Upload sowie Analyse- und Statistikansichten bietet.
  Insgesamt entstand ein funktionsfähiger Prototyp, der zeigt, dass eine kostengünstige und praxisnahe Wurfanalyse im Schul- und Amateurbereich möglich ist. Die Arbeit schafft damit eine solide Grundlage für zukünftige Erweiterungen, insbesondere im Bereich der automatischen Objekterkennung und der weiteren Systemintegration.

da-kurzfassung-en: The aim of this diploma thesis was the development of a software-supported system for the analysis and improvement of basketball shots using video analysis. The main focus lies on the objective evaluation of shooting technique in order to support players with measurable data and visual feedback in optimizing their performance.
 The developed overall system combines several technical components. 
 First, essential shot parameters such as release point, release angle, and ball trajectory are determined from video data. The actual trajectory is then compared with a calculated ideal target trajectory, making deviations visible and comprehensible. 
 Since automatic ball detection did not prove sufficiently reliable under real-world conditions, manual initialization was used to ensure accurate results.
 For processing and storing the collected data, a backend based on Spring Boot was developed. 
 This backend manages player, training, and shot data in a database, calculates statistical key figures, and provides the results via a REST interface. 
 In addition, a browser-based frontend was implemented, offering features such as login, dashboard, video upload, as well as analysis and statistics views.
 Overall, a functional prototype was created, demonstrating that a cost-effective and practical shooting analysis system is feasible for school and amateur sports. 
 The thesis therefore provides a solid foundation for future extensions, particularly in the areas of automatic object detection and further system integration.

